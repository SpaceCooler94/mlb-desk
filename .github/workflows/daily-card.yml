name: daily-card

on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 16 * * *"
    - cron: "30 23 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (CT). Empty = desk clock."
        required: false
        type: string
      phase:
        description: "Desk phase"
        type: choice
        options: [auto, morning, noon, lock, grade]
        default: auto
      fresh:
        description: "Ignore yesterday's manual lines and rebuild seed props"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stack
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            data
            models
          key: mlb-stack-${{ github.ref_name }}
          restore-keys: |
            mlb-stack-
      - name: Unit tests
        working-directory: python
        run: |
          python test_build_day.py
          python test_stack.py
      - name: Build slate
        working-directory: python
        run: |
          EXTRA=""
          if [ -n "${{ inputs.date }}" ]; then EXTRA="$EXTRA --date ${{ inputs.date }}"; fi
          PHASE="${{ inputs.phase }}"
          if [ -z "$PHASE" ]; then PHASE=auto; fi
          if [ "${{ inputs.fresh }}" = "true" ]; then EXTRA="$EXTRA --fresh"; fi
          python run_card.py --phase "$PHASE" $EXTRA
          python export_feed.py
      - name: Commit feed
        run: |
          git config user.name "mlb-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/current.json feed/history.jsonl data models
          git diff --cached --quiet && echo "no card change" && exit 0
          DATE=$(python -c "import json; print(json.load(open('feed/current.json')).get('date'))")
          PHASE=$(python -c "import json; print(json.load(open('feed/current.json')).get('phase','card'))")
          git commit -m "chore: ${DATE} ${PHASE} card"
          git push
