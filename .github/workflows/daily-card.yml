name: daily-card

on:
  schedule:
    # 08:30 CT — morning slate + probable SPs
    - cron: "30 13 * * *"
    # 11:30 CT — noon card (LIVE if starters are named)
    - cron: "30 16 * * *"
    # 18:30 CT — lock remaining first pitches
    - cron: "30 23 * * *"
    # 01:30 CT — grade last night's boxes
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (CT). Empty = desk clock."
        required: false
        type: string
      phase:
        description: "Desk phase"
        type: choice
        options: [auto, morning, noon, lock, grade]
        default: auto
      fresh:
        description: "Ignore yesterday's manual lines and rebuild seed props"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: python
        run: python test_build_day.py
      - name: Build slate
        working-directory: python
        run: |
          EXTRA=""
          if [ -n "${{ inputs.date }}" ]; then EXTRA="$EXTRA --date ${{ inputs.date }}"; fi
          PHASE="${{ inputs.phase }}"
          if [ -z "$PHASE" ]; then PHASE=auto; fi
          if [ "${{ inputs.fresh }}" = "true" ]; then EXTRA="$EXTRA --fresh"; fi
          python build_day.py --phase "$PHASE" $EXTRA
          python export_feed.py
      - name: Commit feed
        run: |
          git config user.name "mlb-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/current.json
          git diff --cached --quiet && echo "no card change" && exit 0
          DATE=$(python -c "import json; print(json.load(open('feed/current.json')).get('date'))")
          PHASE=$(python -c "import json; print(json.load(open('feed/current.json')).get('phase','card'))")
          git commit -m "chore: ${DATE} ${PHASE} card"
          git push
